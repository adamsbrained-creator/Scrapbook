name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Show environment
        shell: bash
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>/dev/null || true
          ls -R . | grep -v "^./.git" | head -80

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # One run builds the APK and runs the tests; --continue reports every failure, not just the first.
      - name: Build debug APK and run unit tests
        shell: bash
        run: gradle assembleDebug testDebugUnitTest --continue --stacktrace --console=plain 2>&1 | tee build.log

      # Puts the actual errors at the top of the run page, so you can read or paste them without downloading anything.
      - name: Summarize problems
        if: always()
        shell: bash
        run: |
          {
            echo "## Build result"
            echo
            echo "### Compiler and Gradle errors"
            echo '```'
            grep -hE "^e: |^w: .*(deprecated)|error:|FAILED|What went wrong|Execution failed|Unresolved reference|Could not (resolve|find|get)|Duplicate class|Manifest merger|AAPT" build.log | sort -u | head -80 || true
            echo '```'
            echo
            echo "### Last 40 lines"
            echo '```'
            tail -n 40 build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scrapbook-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    # Manual only: Actions > Android CI > Run workflow. Signed when the secrets from SIGNING.md exist.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build release APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          gradle assembleRelease --stacktrace --console=plain 2>&1 | tee release.log
      - name: Upload release logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: release.log
          if-no-files-found: ignore
      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scrapbook-release-apk
          path: app/build/outputs/apk/release/*.apk
