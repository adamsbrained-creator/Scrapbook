name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Your signing key, stored under Settings > Secrets and variables > Actions (see SIGNING.md).
      # They are empty on pull requests from forks and until you add them; the build then still works,
      # but the APK is signed with a throwaway key and cannot update an installed copy.
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Show environment
        shell: bash
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning title=No signing key::KEYSTORE_B64 secret is missing. The APK will be signed with a temporary debug key and will not update an installed copy. See SIGNING.md."
            exit 0
          fi
          echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # One run builds the APK and runs the tests; --continue reports every failure, not just the first.
      - name: Build debug APK and run unit tests
        shell: bash
        run: gradle assembleDebug testDebugUnitTest --continue --stacktrace --console=plain 2>&1 | tee build.log

      # Shows which key signed the APK. The SHA-256 line must be identical on every run, otherwise phones refuse the update.
      - name: Show signing certificate
        if: success()
        shell: bash
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          {
            echo "## Signing key"
            echo '```'
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/*.apk | grep -E "Signer #1 certificate (DN|SHA-256)" || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Puts the actual errors at the top of the run page, so you can read or paste them without downloading anything.
      - name: Summarize problems
        if: always()
        shell: bash
        run: |
          {
            echo "## Build result"
            echo
            echo "### Compiler and Gradle errors"
            echo '```'
            grep -hE "^e: |^w: .*(deprecated)|error:|FAILED|What went wrong|Execution failed|Unresolved reference|Could not (resolve|find|get)|Duplicate class|Manifest merger|AAPT" build.log | sort -u | head -80 || true
            echo '```'
            echo
            echo "### Last 40 lines"
            echo '```'
            tail -n 40 build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scrapbook-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    # Runs after every push to main (and manually: Actions > Android CI > Run workflow).
    # Produces the APK to install on your phone. It is built only when the signing key secrets exist.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare signing key
        id: key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning title=Release skipped::Add the signing key secrets from SIGNING.md to get an installable, updatable release APK."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        if: steps.key.outputs.present == 'true'
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        if: steps.key.outputs.present == 'true'
        with:
          gradle-version: "8.9"

      - name: Build release APK
        if: steps.key.outputs.present == 'true'
        shell: bash
        run: gradle assembleRelease --stacktrace --console=plain 2>&1 | tee release.log

      - name: Upload release logs
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: release.log
          if-no-files-found: ignore

      - name: Upload release APK
        if: success() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scrapbook-release-apk
          path: app/build/outputs/apk/release/*.apk
