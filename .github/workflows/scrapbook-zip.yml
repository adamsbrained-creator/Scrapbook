# Build Scrapbook from a ZIP, so you never have to upload lots of files from a phone.
#
# What the repository needs: this file (.github/workflows/scrapbook-zip.yml) and your project as ONE .zip
# at the top of the repo (not inside a folder). Upload a new zip and the build starts by itself.
# The zip can have the project folder inside it or the files directly; either works.
#
# If there is more than one zip, the one uploaded most recently is built. Or press "Run workflow" and
# type the name of the zip you want (handy to go back to an older one).
#
# Same build as "Android CI": signed with YOUR key (the four secrets from SIGNING.md), so a new APK installs
# over the old one and keeps your notes. First time only: run "Create signing key (run once)" and add the secrets.
# Result: Actions > the run > Artifacts > scrapbook-release-apk (a zip with app-release.apk in it). THAT is the one to install.
# The release APK is optimized (R8). If that optimized build ever fails, the workflow builds it once more without
# optimization, so you still get an APK, and says so in the run's Summary page.
# The debug APK (slow: it is only for finding bugs) is NOT built unless you press "Run workflow" and set "Also build debug" to yes.
# If the build fails, the Kotlin compile errors are copied into the run's Summary page.
name: Scrapbook (from zip)

on:
  push:
    branches: [main, master]
    paths: ["*.zip"]
  workflow_dispatch:
    inputs:
      zip:
        description: "Name of the zip to build (empty = the one uploaded most recently)"
        required: false
        default: ""
      minify:
        description: "Optimize the release build (R8). Leave on yes; choose no only if the optimized app misbehaves"
        type: choice
        options: ["yes", "no"]
        default: "yes"
      debug:
        description: "Also build the slow debug APK (scrapbook-debug-apk)"
        type: choice
        options: ["no", "yes"]
        default: "no"

permissions:
  contents: read

# Two uploads in a row: only the last one is built.
concurrency:
  group: scrapbook-zip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # full history, only so we can tell which zip was uploaded last
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the zip
        env:
          INPUT_ZIP: ${{ inputs.zip }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(*.zip)
          if [ -n "${INPUT_ZIP:-}" ]; then
            best="$INPUT_ZIP"
            if [ ! -f "$best" ]; then
              echo "::error::There is no file called '$best' at the top of the repository. Zips found: ${zips[*]:-none}"
              exit 1
            fi
          else
            if [ ${#zips[@]} -eq 0 ]; then
              echo "::error::No .zip file at the top of the repository. Upload your project zip there (not inside a folder)."
              exit 1
            fi
            best=""
            best_t=-1
            for z in "${zips[@]}"; do
              t=$(git log -1 --format=%ct -- "$z" 2>/dev/null || true)
              t=${t:-0}
              if [ "$t" -gt "$best_t" ]; then best="$z"; best_t=$t; fi
            done
          fi
          echo "ZIP=$best" >> "$GITHUB_ENV"
          echo "Building from: $best (zips at the top: ${zips[*]:-none})"

      - name: Unpack the zip and find the project
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/src"
          rm -rf "$dir"
          mkdir -p "$dir"
          # exit code 1 is only a warning (a zip made on Windows, for example); anything higher is a real failure
          unzip -q -o "$ZIP" -d "$dir" || [ $? -eq 1 ]
          f=$(find "$dir" -maxdepth 4 -name 'settings.gradle*' -not -path '*/__MACOSX/*' \
                | awk -F/ '{print NF" "$0}' | sort -n | sed -n '1p' | cut -d' ' -f2-)
          if [ -z "$f" ]; then
            echo "::error::No settings.gradle.kts found inside $ZIP. This is what is in it:"
            unzip -l "$ZIP" | head -60
            exit 1
          fi
          echo "PROJ=$(dirname "$f")" >> "$GITHUB_ENV"
          echo "Project folder: $(dirname "$f")"
          echo "Kotlin files: $(find "$(dirname "$f")" -name '*.kt' | wc -l)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Uses the Android SDK already on the runner. (The setup-android action stopped working: it asks for an old
      # "tools" package that no longer exists.) Gradle downloads anything that is missing once the licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Android only accepts an APK whose version code is higher than the installed one. This workflow has its
      # own run counter (it starts at 1), so the run number would be lower than your older builds. Minutes since
      # 1970 is always higher than the last build, whichever workflow made it. app/build.gradle.kts reads it.
      - name: Version code
        run: echo "VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"

      # Every build must be signed with the SAME key, or Android refuses to update the installed app.
      - name: Prepare the signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error title=No signing key::Add the four secrets KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD (see SIGNING.md). Without them every build gets a different key and Android will not update the app."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          if ! keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/keyinfo.txt" 2>&1; then
            echo "::error title=Signing key problem::The key could not be opened. Check that KEYSTORE_B64 was pasted completely, and that KEYSTORE_PASSWORD and KEY_ALIAS are right."
            exit 1
          fi
          {
            echo "### Built from \`$ZIP\`"
            echo
            echo "### Signing key"
            echo "Must be identical on every run:"
            echo
            grep -m1 "SHA256:" "$RUNNER_TEMP/keyinfo.txt" | sed 's/^ *//'
            echo
            echo "Version 0.1.$GITHUB_RUN_NUMBER (versionCode $VERSION_CODE)"
          } >> "$GITHUB_STEP_SUMMARY"

      # A failing test shows a warning here but does not stop you getting the APK.
      - name: Run tests
        continue-on-error: true
        working-directory: ${{ env.PROJ }}
        run: gradle --no-daemon testDebugUnitTest

      # The release APK: optimized by R8 and signed with your key.
      - name: Build the release APK
        id: optimized
        continue-on-error: true
        shell: bash
        working-directory: ${{ env.PROJ }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MINIFY: ${{ inputs.minify || 'yes' }}
        run: |
          if [ "$MINIFY" = "no" ]; then flag=false; else flag=true; fi
          gradle --no-daemon --console=plain assembleRelease -Pscrapbook.minify=$flag 2>&1 | tee build.log

      # Only runs when the optimized build failed: the same build once more, without the optimization (and without the baseline profile).
      - name: Optimized build failed, building without optimization
        if: steps.optimized.outcome == 'failure' && inputs.minify != 'no'
        shell: bash
        working-directory: ${{ env.PROJ }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cp build.log build-optimized.log
          rm -f app/src/main/baseline-prof.txt
          gradle --no-daemon --console=plain assembleRelease -Pscrapbook.minify=false 2>&1 | tee build.log
          {
            echo "### WARNING: the optimized build failed, so this APK is NOT optimized"
            echo "It works, but it will not be as fast. Send Claude these first errors:"
            echo '```'
            grep -E 'R8|ERROR|error:|What went wrong' -A3 build-optimized.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the debug APK (only when asked for)
        if: inputs.debug == 'yes'
        shell: bash
        working-directory: ${{ env.PROJ }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --console=plain assembleDebug 2>&1 | tee build-debug.log

      - name: Show the APK's signature and type
        continue-on-error: true
        run: |
          APK="$PROJ/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          badging=$("$AAPT2" dump badging "$APK" 2>/dev/null || true)
          case "$badging" in
            *application-debuggable*) kind="DEBUGGABLE (unexpected)" ;;
            *) kind="release build, not debuggable" ;;
          esac
          {
            echo "### Install this one"
            echo "Artifact **scrapbook-release-apk**, file app-release.apk ($kind, $(du -h "$APK" | cut -f1))"
            echo
            echo "APK signature:"
            echo
            "$APKSIGNER" verify --print-certs "$APK" | grep "SHA-256"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: scrapbook-release-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: inputs.debug == 'yes'
        with:
          name: scrapbook-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Show compile errors in the run summary
        if: failure()
        shell: bash
        working-directory: ${{ env.PROJ }}
        run: |
          # only when the build itself ran; if an earlier step failed, open that step's log instead
          if [ -f build.log ]; then
            {
              echo '### Build failed: errors'
              echo '```'
              sed "s#file://$PROJ/##" build.log | grep -E '^e: |^e:|error:|What went wrong|FAILED' -A2 | head -80 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
