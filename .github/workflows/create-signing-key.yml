name: Create signing key (run once)

# Run this ONCE, from the Actions tab, to make the key that signs your app.
# It refuses to run if a key is already saved, or if the repository is public.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Make sure this is safe to run
        env:
          EXISTING: ${{ secrets.KEYSTORE_B64 }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ -n "$EXISTING" ]; then
            echo "::error title=A signing key is already saved::KEYSTORE_B64 already exists. Making a new key would stop Android from updating the app. Nothing was created."
            exit 1
          fi
          if [ "$IS_PRIVATE" != "true" ]; then
            echo "::error title=Repository is public::This repository is public, so the key would be visible to everyone. Make it private first, or create the key on your computer (see SIGNING.md)."
            exit 1
          fi

      - name: Create the key
        run: |
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore release.jks -alias scrapbook -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Scrapbook, O=Scrapbook, C=US"
          mkdir out
          cp release.jks out/release.jks
          base64 -w0 release.jks > out/KEYSTORE_B64.txt
          {
            echo "KEYSTORE_PASSWORD: $PASS"
            echo "KEY_PASSWORD: $PASS"
            echo "KEY_ALIAS: scrapbook"
          } > out/passwords-and-alias.txt

      - uses: actions/upload-artifact@v4
        with:
          name: signing-key-keep-private
          path: out
          retention-days: 2
          if-no-files-found: error
